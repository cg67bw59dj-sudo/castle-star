<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04030a">
<title>星尘城堡</title>
<style>
  :root{ --fw: 720; --fh: 1280; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#04030a;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:radial-gradient(120% 90% at 50% 55%,#0a0618 0%,#05040e 55%,#020106 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2}

  /* 左侧源码：只当纹理，很暗；画在 canvas 下面，会被城堡自然遮住 */
  #code{position:fixed;z-index:1;left:1.5%;top:7.5%;width:31%;height:44%;overflow:hidden;
    pointer-events:none;opacity:.85;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 84%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 84%,transparent 100%);}
  #code pre{position:absolute;left:0;top:0;width:100%;margin:0;
    font:10px/1.55 ui-monospace,Menlo,Consolas,monospace;
    color:#2a3450;white-space:pre;animation:roll 46s linear infinite}
  @keyframes roll{from{transform:translateY(0)}to{transform:translateY(-50%)}}

  /* 字幕 */
  #cap{position:fixed;left:0;right:0;bottom:8.5%;text-align:center;
    pointer-events:none;padding:0 6%;z-index:3}
  #cap .cn{font-size:clamp(17px,4.4vw,30px);color:#fff;letter-spacing:.05em;
    text-shadow:0 0 14px rgba(150,190,255,.75),0 0 30px rgba(120,160,255,.35);
    transition:opacity .45s ease}
  #cap .en{margin-top:.45em;font:clamp(10px,2.5vw,15px)/1.4 Georgia,"Times New Roman",serif;
    color:#c9d6f2;opacity:.8;transition:opacity .45s ease}

  /* 开场遮罩：iOS/微信必须先有一次触摸才能出声 */
  #gate{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;background:rgba(4,3,10,.92);
    color:#cfd8f0;font-size:15px;letter-spacing:.2em;transition:opacity .6s}
  #gate b{font-weight:400;font-size:19px;color:#fff;letter-spacing:.12em}
  #gate .p{width:46px;height:46px;border:1px solid rgba(180,200,255,.55);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#dfe7ff;font-size:18px}
  #gate.off{opacity:0;pointer-events:none}

  /* 操作提示，几秒后自动淡出 */
  #hint{position:fixed;left:0;right:0;bottom:2.6%;text-align:center;z-index:3;
    font-size:11px;letter-spacing:.14em;color:#8b98bd;opacity:0;
    transition:opacity 1.2s;pointer-events:none}
  #hint.show{opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="code"><pre id="srcline"></pre></div>
<div id="cap"><div class="cn"></div><div class="en"></div></div>
<div id="gate"><b>星尘城堡</b><div class="p">▶</div><div>点一下开始</div></div>
<div id="hint">轻点炸开 · 长按蓄力放烟花 · 上下滑切歌词</div>

// ───────────────────────── 基本参数 ─────────────────────────
const DW = 720, DH = 1280;          // 设计尺寸（竖屏）
const N_DOTS = 26000;               // 城堡星尘
const MASS_ALPHA = 0.62;            // 实体层不透明度
const LOOP = 12.91;                 // 音乐长度
const SLOTS = [0.0, 2.7, 6.7, 9.5, 11.3];
const LYRICS = [
  ["为什么晚上总是有星星", "Why are there always stars at night"],
  ["为什么你的眼睛总是亮晶晶", "Why are your eyes always sparkling"],
  ["为什么可乐总是要加冰", "Why does cola always need ice"],
  ["为什么连你的心跳", "Why is it that even your heartbeat"],
  ["我都想用心听", "I want to listen to, with all my heart"]
];
const BEATS = (() => {              // 12.91 秒里 140 BPM 的重音，用来做脉冲
  const a = [], p = 60 / 140;
  for (let t = 0.09; t < LOOP; t += p) a.push(t);
  return a;
})();

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');   // 需要透明画布，才能让下层的源码透出来
const capCn = document.querySelector('#cap .cn');
const capEn = document.querySelector('#cap .en');
const gate = document.getElementById('gate');

let W = 0, H = 0, dpr = 1, SC = 1, OX = 0, OY = 0;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  SC = Math.min(W / DW, H / DH);
  OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// ───────────────────────── 城堡：采样 + 实体层 ─────────────────────────
const CY = 1000;           // 城堡底部在设计坐标里的 y
const CW = 640;            // 城堡宽度
let castleImg = new Image();
let particleLayer = null, massLayer = null;
let px, py, pz, pr, pg, pb;     // 粒子目标与颜色
let csize = { w: 0, h: 0, x: 0, y: 0 };

function lumAt(d, i) { return d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; }

function buildFromImage() {
  // 1) 取像素
  const iw = castleImg.naturalWidth, ih = castleImg.naturalHeight;
  const tmp = document.createElement('canvas'); tmp.width = iw; tmp.height = ih;
  const tc = tmp.getContext('2d'); tc.drawImage(castleImg, 0, 0);
  const src = tc.getImageData(0, 0, iw, ih).data;

  // 2) 剪影：绝对亮度，再做一次开/闭运算去掉细线、补上内部空洞
  let m = new Uint8Array(iw * ih);
  for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) {
    const i = (y * iw + x) * 4;
    m[y * iw + x] = lumAt(src, i) > 26 ? 1 : 0;
  }
  const erode = (a, w, h) => { const b = new Uint8Array(a.length);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x; b[i] = (a[i] && a[i-1] && a[i+1] && a[i-w] && a[i+w]) ? 1 : 0; }
    return b; };
  const dilate = (a, w, h) => { const b = new Uint8Array(a.length);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      b[i] = (a[i]|a[i-1]|a[i+1]|a[i-w]|a[i+w]) ? 1 : 0; }
    return b; };

  m = erode(m, iw, ih);                 // 削掉 1px 细线
  m = dilate(m, iw, ih); m = dilate(m, iw, ih);
  m = erode(m, iw, ih); m = erode(m, iw, ih);   // 开运算
  // 填内部空洞：从边框灌水，剩下的空洞就是内部
  const outside = new Uint8Array(m.length); const st = [];
  for (let x = 0; x < iw; x++) { st.push(x, (ih-1)*iw + x); }
  for (let y = 0; y < ih; y++) { st.push(y*iw, y*iw + iw-1); }
  while (st.length) {
    const i = st.pop();
    if (outside[i] || m[i]) continue;
    outside[i] = 1;
    const x = i % iw, y = (i - x) / iw;
    if (x > 0) st.push(i-1); if (x < iw-1) st.push(i+1);
    if (y > 0) st.push(i-iw); if (y < ih-1) st.push(i+iw);
  }
  for (let i = 0; i < m.length; i++) if (!m[i] && !outside[i]) m[i] = 1;

  // 3) 深度：离轮廓越远越靠前（用两次膨胀近似距离场）
  let d1 = m, d2 = dilate(m, iw, ih), d3 = dilate(d2, iw, ih);
  const depth = new Float32Array(m.length);
  for (let i = 0; i < m.length; i++) {
    depth[i] = m[i] ? (d2[i] ? (d3[i] ? 1 : 0.72) : 0.42) : 0;
  }

  // 4) 画布位置
  const sc = CW / iw;
  csize = { w: Math.round(iw * sc), h: Math.round(ih * sc),
            x: Math.round((DW - iw * sc) / 2), y: CY - Math.round(ih * sc) };

  // 5) 实体层：原图 + 剪影 alpha（下沿做渐隐，别露出图片的硬边）
  const yFade = (y) => Math.min(1, Math.max(0, (ih - 6 - y) / 18));
  const mc = document.createElement('canvas'); mc.width = iw; mc.height = ih;
  const mctx = mc.getContext('2d');
  const md = mctx.createImageData(iw, ih);
  for (let i = 0, j = 0; i < m.length; i++, j += 4) {
    const k = i * 4, yy = ((i - (i % iw)) / iw);
    md.data[j] = src[k]; md.data[j+1] = src[k+1]; md.data[j+2] = src[k+2];
    md.data[j+3] = m[i] ? 255 * yFade(yy) : 0;
  }
  mctx.putImageData(md, 0, 0);
  massLayer = mc;

  // 6) 采样粒子
  const idxs = [];
  for (let i = 0; i < m.length; i++) if (m[i]) idxs.push(i);
  const n = N_DOTS;
  px = new Float32Array(n); py = new Float32Array(n); pz = new Float32Array(n);
  pr = new Uint8Array(n); pg = new Uint8Array(n); pb = new Uint8Array(n);
  for (let k = 0; k < n; k++) {
    const i = idxs[(Math.random() * idxs.length) | 0];
    const x = i % iw, y = (i - x) / iw, c = i * 4;
    // 提亮 + 拉饱和
    let r = src[c], g = src[c+1], b = src[c+2];
    const v = Math.max(r, g, b) / 255;
    const sat = 1.30;
    r = v * 255 + (r - v * 255) * sat; g = v * 255 + (g - v * 255) * sat;
    b = v * 255 + (b - v * 255) * sat;
    const hot = 0.34 * Math.max(0, (v - 0.68) / 0.32);
    r = r * (1 - hot) + 255 * hot; g = g * (1 - hot) + 255 * hot; b = b * (1 - hot) + 255 * hot;
    const d = depth[i];
    const k2 = (92 + 128 * d) * yFade(y);
    px[k] = csize.x + (x + Math.random() - 0.5) * sc;
    py[k] = csize.y + (y + Math.random() - 0.5) * sc;
    pz[k] = d;
    pr[k] = Math.min(255, r * k2 / 255); pg[k] = Math.min(255, g * k2 / 255);
    pb[k] = Math.min(255, b * k2 / 255);
  }

  // 7) 把粒子一次性画进离屏层（之后每帧只 blit 一次）
  const Q = 2;
  particleLayer = document.createElement('canvas');
  particleLayer.width = DW * Q; particleLayer.height = DH * Q;
  const lc = particleLayer.getContext('2d');
  lc.globalCompositeOperation = 'lighter';
  const buckets = new Map();
  for (let k = 0; k < n; k++) {
    const key = (pr[k] >> 4) * 256 + (pg[k] >> 4) * 16 + (pb[k] >> 4);
    let a = buckets.get(key); if (!a) { a = []; buckets.set(key, a); }
    a.push(k);
  }
  const size = Math.max(1, 1.7 * Q);
  for (const [key, arr] of buckets) {
    const r = ((key >> 8) & 15) * 17, g = ((key >> 4) & 15) * 17, b = (key & 15) * 17;
    lc.fillStyle = `rgb(${r},${g},${b})`;
    for (let j = 0; j < arr.length; j++) {
      const k = arr[j];
      lc.fillRect(px[k] * Q, py[k] * Q, size, size);
    }
  }
  return true;
}

// ───────────────────────── 动画元素 ─────────────────────────
const stars = Array.from({ length: 150 }, () => ({
  x: Math.random() * DW, y: Math.random() * DH * 0.95,
  a: Math.random(), s: 0.3 + Math.random() * 1.5
}));
const snow = Array.from({ length: 160 }, () => ({
  x: Math.random() * DW, y: Math.random() * DH,
  r: 0.8 + Math.random() * 1.8, v: 14 + Math.random() * 46,
  sw: Math.random() * 6.28, ph: Math.random() * 6.28, a: 0.25 + Math.random() * 0.5
}));
const motes = Array.from({ length: 18 }, () => ({
  x: Math.random() * DW, y: Math.random() * DH,
  r: 8 + Math.random() * 22, v: 4 + Math.random() * 10,
  ph: Math.random() * 6.28, a: 0.05 + Math.random() * 0.08
}));

// 星带：绕城堡盘旋的螺旋
const BELT_N = 1400;
const belt = Array.from({ length: BELT_N }, () => ({
  s: Math.random(), jr: (Math.random() - 0.5) * 10,
  jy: (Math.random() - 0.5) * 9, ja: (Math.random() - 0.5) * 0.05,
  t: Math.random()
}));
// 星环：反向、倾斜
const RING_N = 700;
const ring = Array.from({ length: RING_N }, () => ({
  a: Math.random() * 6.283, r: 1 + (Math.random() - 0.5) * 0.024,
  y: (Math.random() - 0.5) * 10, t: Math.random()
}));

// 爆点
let burst = [];
function spawnBurst(cx, cy, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = (0.25 + Math.random()) * power;
    burst.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      life: 0.7 + Math.random() * 0.9, max: 1.6,
      c: Math.random() < 0.5 ? "235,215,255" : "200,220,255" });
  }
  if (burst.length > 1600) burst.splice(0, burst.length - 1600);
}

// ───────────────────────── 交互状态 ─────────────────────────
let rot = 0, rotTarget = 0, zoom = 1, zoomF = 1;
let flash = 0, charge = 0;
let audio = null, started = false, clock = 0, curT = 0;
const pointers = new Map();
let press = null;
const shells = [];
const waves = [];
const PALETTE = [[255,200,140],[255,150,190],[190,170,255],[150,225,255],[255,236,190]];

function designPos(e) {
  const x = (e.clientX - OX) / SC, y = (e.clientY - OY) / SC;
  return { x, y };
}

cv.addEventListener('pointerdown', e => {
  const p = designPos(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 1) {
    press = { x: p.x, y: p.y, t0: performance.now(), moved: 0, charging: false, c0: 0, power: 0.5 };
  }
});
cv.addEventListener('pointermove', e => {
  const p = designPos(e);
  const prev = pointers.get(e.pointerId);
  if (prev && pointers.size === 1) {
    const dx = p.x - prev.x, dy = p.y - prev.y;
    if (press) press.moved += Math.hypot(dx, dy);
    if (!(press && press.charging)) {
      rotTarget = Math.max(-1, Math.min(1, rotTarget + dx * 0.0022));
    }
  }
  pointers.set(e.pointerId, p);
  if (pointers.size === 2) {          // 双指缩放
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (!cv._pd) cv._pd = d;
    else { zoomF = Math.max(0.85, Math.min(1.6, zoomF * (d / cv._pd))); cv._pd = d; }
  }
});
function endPointer(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) cv._pd = 0;
  if (pointers.size === 0) {
    const pr = press; press = null;
    if (pr) {
      const held = performance.now() - pr.t0;
      const dy = p ? p.y - pr.y : 0, dx = p ? p.x - pr.x : 0;
      if (pr.charging) {                       // 蓄力 → 放烟花
        firework(pr.x, Math.max(160, pr.y), pr.power);
      } else if (Math.abs(dy) > 46 && Math.abs(dy) > Math.abs(dx) * 1.3) {
        jumpLyric(dy < 0 ? 1 : -1);            // 上下滑 → 切歌词
      } else if (pr.moved < 8 && held < 380) { // 轻点 → 炸星尘
        spawnBurst(pr.x, pr.y, 150, 320);
        flash = Math.max(flash, 0.9);
      }
    }
    charge = 0;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

// 蓄力放烟花：一颗弹先升空，到点炸开
function firework(x, y, power) {
  shells.push({ x, y0: y + 300, y, t: 0, power: Math.min(1, power), c: PALETTE[(Math.random() * PALETTE.length) | 0] });
}
function explode(x, y, power, c) {
  const n = Math.round(180 + 460 * power);
  const base = 200 + 300 * power;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = base * (0.2 + Math.random() * 0.95);
    burst.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1.0 + Math.random() * 1.0, c: c.join(",") });
  }
  if (burst.length > 3200) burst.splice(0, burst.length - 3200);
  waves.push({ x, y, t: 0, c: c.join(",") });
  flash = Math.max(flash, 0.35 + 0.6 * power);
}

// 上下滑：直接跳到上一句/下一句的起点，音乐跟着一起跳，永远对齐
function jumpLyric(dir) {
  let i = 0;
  for (let k = 0; k < SLOTS.length; k++) if (curT >= SLOTS[k]) i = k;
  const j = (i + dir + SLOTS.length) % SLOTS.length;
  if (audio && started) { try { audio.currentTime = SLOTS[j] + 0.01; } catch (e) {} }
  clock = SLOTS[j] + 0.01;
  flash = Math.max(flash, 0.4);
  spawnBurst(DW / 2, CY - 260, 70, 220);
}

// 字幕
let capIdx = -1;
function setCaption(i) {
  if (i === capIdx) return;
  capIdx = i;
  capCn.style.opacity = 0; capEn.style.opacity = 0;
  setTimeout(() => {
    capCn.textContent = LYRICS[i][0]; capEn.textContent = LYRICS[i][1];
    capCn.style.opacity = 1; capEn.style.opacity = .8;
  }, 200);
}

// ───────────────────────── 主循环 ─────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  clock += dt;
  const t = started && audio && !audio.paused ? (audio.currentTime % LOOP) : (clock % LOOP);
  curT = t;

  // 长按蓄力：按住不动 0.42 秒后开始充能，最多 1.3 秒充满
  if (press && !press.charging && pointers.size === 1 &&
      now - press.t0 > 420 && press.moved < 16) {
    press.charging = true; press.c0 = now;
  }
  if (press && press.charging) {
    charge = Math.min(1, (now - press.c0) / 1300);
    press.power = 0.35 + 0.65 * charge;
  }

  rot += (rotTarget - rot) * Math.min(1, dt * 6);
  zoom += (zoomF - zoom) * Math.min(1, dt * 6);
  flash *= Math.pow(0.05, dt);

  // 节拍脉冲
  let pulse = 0;
  for (let i = 0; i < BEATS.length; i++) {
    const d = Math.abs(t - BEATS[i]);
    if (d < 0.2) { const v = Math.exp(-((d / 0.055) ** 2)); if (v > pulse) pulse = v; }
  }
  const lift = 1 + 0.22 * pulse + 0.35 * flash + 0.28 * charge;

  // ── 画面 ──
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(SC * dpr, 0, 0, SC * dpr, OX * dpr, OY * dpr);
  ctx.save();
  // 绕城堡摆动：横向压缩 + 整体位移
  const ca = Math.cos(rot * 0.32), orbit = rot * 26;
  ctx.translate(DW / 2 + orbit, CY);
  ctx.scale(ca * zoom, zoom);
  ctx.translate(-DW / 2, -CY);

  // 星星
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(clock * s.s + s.a));
    if (a < 0.45) continue;
    ctx.fillStyle = `rgba(150,165,200,${a * 0.8})`;
    ctx.fillRect(s.x, s.y, 1.8, 1.8);
  }

  // 实体层
  if (massLayer) {
    ctx.globalAlpha = MASS_ALPHA * Math.min(1, lift);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(massLayer, csize.x, csize.y, csize.w, csize.h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
  }

  // 星尘（预渲染层，用亮度呼吸代替逐点闪烁）
  if (particleLayer) {
    ctx.globalAlpha = Math.min(1, 0.86 * lift);
    ctx.drawImage(particleLayer, 0, 0, DW * 2, DH * 2, 0, 0, DW, DH);
    ctx.globalAlpha = 1;
  }

  // 星带
  const bcx = DW / 2, bcy = CY - 40;
  for (let i = 0; i < belt.length; i++) {
    const b = belt[i];
    const ang = b.s * 1.75 * 6.283 + clock * 0.30 + b.ja;
    const R = 250 - 115 * b.s + b.jr;
    const wx = Math.cos(ang) * R, wz = Math.sin(ang) * R;
    const near = 0.5 - 0.5 * (wz / R);
    const fade = 0.22 + 0.78 * near;
    const y = bcy - b.s * 430 + b.jy + wz * 0.16;
    const a = Math.min(1, fade * (0.5 + 0.5 * Math.sin(clock * 1.6 + b.t * 6)));
    ctx.fillStyle = `rgba(205,222,255,${a * 0.85})`;
    ctx.fillRect(bcx + wx, y, 1.6, 1.6);
  }
  // 星环
  const ry = CY - 330;
  for (let i = 0; i < ring.length; i++) {
    const r = ring[i];
    const ang = r.a - clock * 0.55;
    const R = 215;
    const wx = Math.cos(ang) * R * r.r, wz = Math.sin(ang) * R * r.r;
    const near = 0.5 - 0.5 * (wz / R);
    ctx.fillStyle = `rgba(190,210,255,${(0.16 + 0.7 * near) * 0.8})`;
    ctx.fillRect(bcx + wx, ry + wz * 0.34 + r.y, 1.5, 1.5);
  }

  // 雪
  for (const s of snow) {
    s.y += s.v * dt; s.x += Math.sin(clock * 0.8 + s.ph) * 10 * dt;
    if (s.y > DH + 8) { s.y = -8; s.x = Math.random() * DW; }
    ctx.fillStyle = `rgba(210,225,255,${s.a * 0.8})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  // 爆点
  for (let i = burst.length - 1; i >= 0; i--) {
    const p = burst[i];
    p.life -= dt; if (p.life <= 0) { burst.splice(i, 1); continue; }
    p.vy += 170 * dt; p.vx *= 0.99;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const a = Math.min(1, p.life);
    ctx.fillStyle = `rgba(${p.c},${a})`;
    ctx.fillRect(p.x, p.y, 3.2, 3.2);
  }
  // 烟花弹升空 → 到点炸开
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.t += dt * 2.0;
    const e = 1 - Math.pow(1 - Math.min(1, s.t), 3);
    const y = s.y0 + (s.y - s.y0) * e;
    if (s.t >= 1) { explode(s.x, s.y, s.power, s.c); shells.splice(i, 1); continue; }
    ctx.fillStyle = 'rgba(255,244,224,0.95)';
    ctx.fillRect(s.x - 1.2, y - 1.2, 2.6, 2.6);
    ctx.fillStyle = 'rgba(200,214,255,0.35)';
    ctx.fillRect(s.x - 0.8, y + 5, 1.8, 2);
  }

  // 爆炸冲击波
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.t += dt * 1.15;
    if (w.t >= 1) { waves.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(${w.c},${(1 - w.t) * 0.55})`;
    ctx.lineWidth = 2 + 3 * (1 - w.t);
    ctx.beginPath(); ctx.arc(w.x, w.y, 24 + 170 * w.t, 0, 6.283); ctx.stroke();
  }

  // 蓄力圈
  if (press && press.charging) {
    const R = 22 + 58 * charge;
    ctx.strokeStyle = `rgba(205,225,255,${0.45 + 0.5 * charge})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(press.x, press.y, R, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = `rgba(150,190,255,${0.25 + 0.4 * charge})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(press.x, press.y, R * 0.6, 0, 6.283); ctx.stroke();
    ctx.fillStyle = `rgba(225,236,255,${0.10 + 0.3 * charge})`;
    ctx.beginPath(); ctx.arc(press.x, press.y, R * 0.28, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  // 曝光闪
  if (flash > 0.02) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(70,86,150,${flash * 0.20})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }

  // 字幕
  let k = 0; for (let i = 0; i < SLOTS.length; i++) if (t >= SLOTS[i]) k = i;
  setCaption(k);

  requestAnimationFrame(frame);
}

// ───────────────────────── 启动 ─────────────────────────
function start() {
  if (started) return;
  started = true;
  gate.classList.add('off');
  if (audio) { audio.volume = 0.75; audio.play().catch(() => {}); }
  const hint = document.getElementById('hint');
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 7000);
}

window.addEventListener('load', () => {
  resize();
  castleImg.onload = () => {
    buildFromImage();
    const pre = document.getElementById('srcline');
    pre.textContent = SRC_TEXT + SRC_TEXT;     // 滚两遍，接缝不明显
    requestAnimationFrame(frame);
  };
  castleImg.src = IMG_SRC;

  audio = new Audio(AUDIO_SRC);
  audio.loop = true;
  audio.preload = 'auto';

  gate.addEventListener('click', start);
  gate.addEventListener('touchstart', start, { passive: true });
});

// 左侧滚动的源码（就是这段程序自己的核心片段）
const SRC_TEXT = `// 星尘粒子 · 数字城堡
// 每颗星尘都在找一个位置

const N_DOTS = 26000;
const MASS_ALPHA = 0.62;

function buildFromImage() {
  // 1) 取像素
  const src = tc.getImageData(0, 0, iw, ih).data;

  // 2) 剪影：绝对亮度 + 开闭运算
  let m = new Uint8Array(iw * ih);
  for (let y = 0; y < ih; y++)
    for (let x = 0; x < iw; x++) {
      const i = (y * iw + x) * 4;
      m[y * iw + x] = lumAt(src, i) > 26 ? 1 : 0;
    }

  // 3) 深度：离轮廓越远越靠前
  depth[i] = m[i] ? (d2[i] ? (d3[i] ? 1 : 0.72) : 0.42) : 0;

  // 4) 采样粒子
  for (let k = 0; k < n; k++) {
    px[k] = csize.x + x * sc;
    py[k] = csize.y + y * sc;
    pz[k] = d;
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  rot += (rotTarget - rot) * dt * 6;
  flash *= Math.pow(0.05, dt);

  // 节拍脉冲
  const lift = 1 + 0.22 * pulse;

  for (let i = 0; i < belt.length; i++) {
    const ang = b.s * 1.75 * 6.283 + clock * 0.30;
    const R = 250 - 115 * b.s + b.jr;
    const near = 0.5 - 0.5 * (wz / R);
  }
  requestAnimationFrame(frame);
}
`;
</script>
</body>
